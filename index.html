
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Welcome Bonus Comparison</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1e293b;
    }

    header {
      background: #14213d;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 10px; }
    header p { margin: 0; color: #dbeafe; }

    main {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .status {
      padding: 14px;
      background: white;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0f172a12;
      border-top: 4px solid #2563eb;
    }

    .card h2 { font-size: 20px; margin-top: 0; }
    .bonus { font-size: 21px; font-weight: bold; color: #1d4ed8; }
    .field { margin: 15px 0; }
    .label { font-size: 12px; color: #64748b; text-transform: uppercase; }
    .value { margin-top: 5px; font-weight: 600; overflow-wrap: anywhere; }
    a { color: #1d4ed8; }
    .source { margin-top: 18px; font-size: 14px; }
    footer { text-align: center; padding: 24px; color: #64748b; font-size: 13px; }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <h1>Casino Welcome Bonus Comparison</h1>
    <p>Compare welcome offers, wagering requirements and minimum deposits.</p>
  </header>

  <main>
    <div class="status" id="status">Loading bonus data from bonuses.json...</div>
    <div class="cards" id="cards"></div>
    <p><button id="reload">Reload bonus data</button></p>
  </main>

  <footer>
    Data collected from the listed public source. Offers may change.
    Check the source website for current terms. 18+ only.
  </footer>

  <script>
    async function loadBonuses() {
      const status = document.getElementById("status");
      const cards = document.getElementById("cards");

      status.textContent = "Loading bonus data...";
      cards.replaceChildren();

      try {
        const response = await fetch("bonuses.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Could not load bonuses.json (HTTP " + response.status + ").");
        }

        const data = await response.json();
        const casinos = data.casinos;

        if (!Array.isArray(casinos) || casinos.length === 0) {
          throw new Error("No casino records were found in bonuses.json.");
        }

        status.textContent = casinos.length + " casino records loaded.";

        for (const casino of casinos) {
          const card = document.createElement("article");
          card.className = "card";

          const title = document.createElement("h2");
          title.textContent = casino.casino_name || "Unnamed casino";
          card.appendChild(title);

          const bonus = document.createElement("div");
          bonus.className = "bonus";
          bonus.textContent = casino.welcome_bonus || "Not stated";
          card.appendChild(bonus);

          function addField(label, value) {
            const field = document.createElement("div");
            field.className = "field";

            const heading = document.createElement("div");
            heading.className = "label";
            heading.textContent = label;

            const content = document.createElement("div");
            content.className = "value";
            content.textContent = value == null || value === ""
              ? "Not stated"
              : String(value);

            field.append(heading, content);
            card.appendChild(field);
          }

          addField("Wagering requirement",
            casino.wagering_requirement == null
              ? "Not stated"
              : casino.wagering_requirement + "x");

          addField("Minimum deposit", casino.minimum_deposit);

          const source = document.createElement("div");
          source.className = "source";

          const link = document.createElement("a");
          link.href = casino.source_url || data.source_url || "#";
          link.textContent = "View source";
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          source.appendChild(link);
          card.appendChild(source);
          cards.appendChild(card);
        }
      } catch (error) {
        status.textContent = error.message +
          " Run the page through a local web server and check that bonuses.json exists.";
      }
    }

    document.getElementById("reload").addEventListener("click", loadBonuses);
    loadBonuses();
  </script>
</body>
</html>
